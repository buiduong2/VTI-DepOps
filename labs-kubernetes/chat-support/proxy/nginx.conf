# HTTP → HTTPS
server {
    listen 80;
    server_name chat.local.test auth.local.test chat-api.local.test;

    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name chat.local.test auth.local.test chat-api.local.test;

    ssl_certificate /etc/nginx/certs/chat-support.pem;
    ssl_certificate_key /etc/nginx/certs/chat-support-key.pem;

    location / {
        proxy_pass https://chat-ingress:443;
        proxy_http_version 1.1;

        # TLS tới Envoy
        proxy_ssl_server_name on;
        proxy_ssl_name $host;

        # Forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
    }
}
