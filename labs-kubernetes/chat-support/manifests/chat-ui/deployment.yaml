apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui-deployment
  labels:
    app: chat-ui-deployment
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-ui
  template:
    metadata:
      labels:
        app: chat-ui
    spec:
      containers:
        - name: chat-ui-container
          image: duongbd1997/lacdau-chat-ui:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom: 
            - secretRef:
                name: chat-ui-secret

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          startupProbe:
            httpGet:
              path: /internal/health/live
              port: 3000
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /internal/health/ready
              port: 3000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /internal/health/live
              port: 3000
            periodSeconds: 10
            failureThreshold: 3