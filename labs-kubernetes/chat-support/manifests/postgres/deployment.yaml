apiVersion: apps/v1
kind: Deployment
metadata: 
    name: postgres
    labels: 
        app: postgres-deployment

spec: 
    replicas: 1
    selector: 
        matchLabels: 
          app: postgres
    template: 
        metadata: 
            labels: 
                app: postgres
                tier: db
        spec: 
            containers: 
                - name: postgres
                  image: postgres:17-alpine
                  ports: 
                      - containerPort: 5432
                  envFrom: 
                      - secretRef: 
                          name: postgres-secret
                  volumeMounts:
                      - name: postgres-storage
                        mountPath: /var/lib/postgresql/data
                        subPath: pgdata

                      - name: postgres-init
                        mountPath: /docker-entrypoint-initdb.d
                        readOnly: true
                  
                  resources:
                    requests:
                      cpu: "50m"
                      memory: "128Mi"
                    limits:
                      cpu: "500m"
                      memory: "512Mi"
                      
            volumes:
                - name: postgres-storage
                  persistentVolumeClaim: 
                      claimName: postgres-data

                - name: postgres-init
                  configMap:
                      name: postgres-init
