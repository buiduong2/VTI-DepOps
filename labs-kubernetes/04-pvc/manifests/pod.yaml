apiVersion: v1
kind: Pod
metadata:
    name: postgres
    labels:
      app: postgres
spec:
    containers:
        - name: postgres
          image: postgres:17-alpine
          env:
              - name: POSTGRES_PASSWORD
                value: "postgres"
          ports:
              - containerPort: 5432
          volumeMounts:
              - name: postgres-storage
                mountPath: /var/lib/postgresql/data
                subPath: pgdata
    volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-data

