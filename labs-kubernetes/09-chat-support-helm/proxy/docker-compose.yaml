services:
  nginx:
    image: nginx:alpine
    container_name: nginx-chat-support
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
    networks:
      - chat-ingress-net

networks:
  chat-ingress-net:
    external: true
